<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>UrCare</title>
<!-- Shown inside the app (Capacitor server.errorPath) when the UrCare server
     can't be reached, e.g. no internet. Retries by itself once back online. -->
<style>
  :root { --bg: #f0fdf4; --fg: #14532d; --muted: #4b5563; --accent: #008000; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; text-align: center; }
  .card { max-width: 360px; width: 100%; }
  img { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,128,0,.18); }
  h1 { font-size: 1.35rem; margin: 20px 0 6px; }
  p { color: var(--muted); margin: 0 0 22px; }
  button { appearance: none; border: 0; background: var(--accent); color: #fff; font-weight: 700; font-size: 1rem; padding: 14px 28px; border-radius: 999px; width: 100%; cursor: pointer; }
  button:active { transform: scale(.98); }
  .hi { margin-top: 18px; font-size: .9rem; }
</style>
</head>
<body>
  <div class="card">
    <img src="urcare-logo-mark.png" alt="UrCare" onerror="this.style.display='none'" />
    <h1>No internet connection</h1>
    <p>UrCare needs the internet to load your plan. Please check your Wi-Fi or mobile data.</p>
    <button id="retry" type="button">Try again</button>
    <p class="hi">इंटरनेट कनेक्शन नहीं है। कृपया Wi-Fi या मोबाइल डेटा चालू करके फिर से कोशिश करें।</p>
  </div>
<script>
  var APP_URL = 'https://urcare-app.onrender.com/';
  function retry() { document.getElementById('retry').textContent = 'Connecting…'; window.location.href = APP_URL; }
  document.getElementById('retry').addEventListener('click', retry);
  window.addEventListener('online', retry);
</script>
</body>
</html>
