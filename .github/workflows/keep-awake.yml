# Keeps the Render server awake. Render's free plan sleeps after ~15 minutes
# without traffic, and the first request after that takes 30-50 s. Google Play
# checks the privacy / delete-account URLs (and app review opens them), so a
# sleeping server can get those URLs flagged as unreachable.
name: Keep server awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health, privacy and delete-account pages
        run: |
          for path in /api/health /privacy.html /delete-account.html; do
            curl -s -o /dev/null -m 90 --retry 2 -w "$path -> %{http_code} in %{time_total}s\n" "https://urcare-app.onrender.com$path" || true
          done
